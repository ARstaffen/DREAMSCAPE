<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0a1a">
<title>Dreamscape</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --bg: #0b0a1a;
    --bg2: #141230;
    --card: #1a1838;
    --line: #2c2958;
    --text: #e9e6f7;
    --muted: #9a95c2;
    --accent: #b8a6ff;
    --accent2: #7fd1c7;
    --warn: #f0a6a6;
    --serif: "Cormorant Garamond", Georgia, serif;
    --sans: "Inter", system-ui, sans-serif;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; }
  body {
    background: radial-gradient(120% 80% at 50% -10%, #221d4f 0%, var(--bg) 60%) fixed, var(--bg);
    color: var(--text);
    font-family: var(--sans);
    font-size: 16px;
    line-height: 1.5;
    min-height: 100vh;
  }
  main { max-width: 560px; margin: 0 auto; padding: 24px 16px 120px; }
  h1, h2 { font-family: var(--serif); font-weight: 500; letter-spacing: .01em; margin: 0; }
  h1 { font-size: 2.2rem; }
  h2 { font-size: 1.7rem; line-height: 1.25; }
  p { margin: 0; }
  .muted { color: var(--muted); }
  .small { font-size: .85rem; }
  .screen { display: none; }
  .screen.on { display: block; animation: fade .35s ease; }
  @keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .stack > * + * { margin-top: 16px; }

  .card { background: color-mix(in srgb, var(--card) 85%, transparent); border: 1px solid var(--line); border-radius: 18px; padding: 18px; }
  .sky { display: flex; gap: 14px; align-items: center; }
  .moon { width: 46px; height: 46px; flex: none; }
  .sky b { font-weight: 600; }

  button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; }
  .btn { display: block; width: 100%; padding: 15px 18px; border-radius: 14px; font-weight: 600; text-align: center;
         background: var(--accent); color: #1a1440; }
  .btn.ghost { background: transparent; color: var(--text); border: 1px solid var(--line); font-weight: 500; }
  .btn:disabled { opacity: .45; }
  .wake { padding: 22px; font-size: 1.15rem; font-family: var(--serif); font-weight: 500; font-size: 1.5rem; }

  label.f { display: block; font-size: .85rem; color: var(--muted); margin-bottom: 6px; }
  input[type=email], input[type=password], input[type=text], input[type=time], textarea {
    width: 100%; font: inherit; color: var(--text); background: var(--bg2); border: 1px solid var(--line);
    border-radius: 12px; padding: 13px 14px; outline: none;
  }
  input:focus, textarea:focus { border-color: var(--accent); }
  textarea { min-height: 190px; resize: vertical; line-height: 1.6; }
  input[type=time] { color-scheme: dark; }

  .q { font-family: var(--serif); font-size: 1.55rem; line-height: 1.3; }
  .hint { color: var(--muted); font-size: .92rem; }

  .mic { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-radius: 999px;
         border: 1px solid var(--line); color: var(--muted); font-size: .92rem; }
  .mic.live { border-color: var(--warn); color: var(--warn); }
  .mic .dot { width: 10px; height: 10px; border-radius: 50%; background: currentColor; }
  .mic.live .dot { animation: pulse 1.1s infinite; }
  @keyframes pulse { 50% { opacity: .25; } }

  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { padding: 9px 14px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); font-size: .92rem; }
  .chip.on { background: color-mix(in srgb, var(--accent) 22%, transparent); border-color: var(--accent); color: var(--text); }

  .opt { text-align: left; width: 100%; padding: 16px; border-radius: 14px; border: 1px solid var(--line); }
  .opt b { display: block; font-family: var(--serif); font-size: 1.3rem; font-weight: 500; }
  .opt span { color: var(--muted); font-size: .9rem; }
  .opt.on { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 14%, transparent); }

  .slider { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; align-items: center; }
  .slider output { font-family: var(--serif); font-size: 1.4rem; color: var(--accent); min-width: 2ch; text-align: right; }
  .slider small { grid-column: 1 / -1; color: var(--muted); font-size: .8rem; margin-top: -4px; }
  input[type=range] { grid-column: 1 / -1; width: 100%; accent-color: var(--accent); }

  .progress { display: flex; gap: 6px; }
  .progress i { flex: 1; height: 3px; border-radius: 3px; background: var(--line); }
  .progress i.on { background: var(--accent); }

  .nav { position: fixed; left: 0; right: 0; bottom: 0; padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
         background: linear-gradient(transparent, var(--bg) 35%); }
  .nav .row { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: 1fr 2fr; gap: 10px; }

  .entry { padding: 14px 0; border-top: 1px solid var(--line); }
  .entry:first-child { border-top: 0; }
  .entry .meta { color: var(--muted); font-size: .8rem; display: flex; gap: 10px; flex-wrap: wrap; }
  .entry p { margin-top: 4px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .entry { cursor: pointer; }
  .sec { font-size: .75rem; letter-spacing: .12em; text-transform: uppercase; color: var(--accent2); margin-bottom: 8px; }
  .trig { padding: 10px 0; border-top: 1px solid var(--line); }
  .trig:first-of-type { border-top: 0; }
  .trig b { font-weight: 600; }
  .tag { font-size: .72rem; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); margin-left: 6px; vertical-align: middle; }
  .tag.primary { border-color: var(--accent); color: var(--accent); }
  .bars { display: grid; grid-template-columns: 56px 1fr 24px; gap: 6px 10px; align-items: center; font-size: .85rem; }
  .bar { height: 8px; border-radius: 8px; background: var(--line); overflow: hidden; }
  .bar i { display: block; height: 100%; border-radius: 8px; }
  .quote { font-family: var(--serif); font-size: 1.15rem; line-height: 1.5; white-space: pre-wrap; }
  .term { color: inherit; font: inherit; padding: 0; border-bottom: 1px dotted var(--accent); cursor: help; }
  .sheet-bg { position: fixed; inset: 0; background: rgba(5,4,15,.6); opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 20; }
  .sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 21; background: var(--bg2); border-top: 1px solid var(--line);
           border-radius: 20px 20px 0 0; padding: 22px 20px calc(22px + env(safe-area-inset-bottom)); max-width: 560px; margin: 0 auto;
           transform: translateY(105%); transition: transform .25s ease; }
  .sheet.on { transform: none; } .sheet-bg.on { opacity: 1; pointer-events: auto; }
  .more { color: var(--accent); font-size: .9rem; margin-top: 10px; }
  .err { color: var(--warn); font-size: .9rem; }
  .top { display: flex; justify-content: space-between; align-items: baseline; }
  .link { color: var(--muted); font-size: .85rem; text-decoration: underline; }
</style>
</head>
<body>
<main>

  <!-- SIGN IN -->
  <section id="s-auth" class="screen stack">
    <h1>Dreamscape</h1>
    <p class="muted">Sign in with the same account you use for Almanac.</p>
    <div><label class="f" for="email">Email</label><input id="email" type="email" autocomplete="email"></div>
    <div><label class="f" for="pw">Password</label><input id="pw" type="password" autocomplete="current-password"></div>
    <p id="auth-err" class="err"></p>
    <button class="btn" id="signin">Sign in</button>
  </section>

  <!-- HOME -->
  <section id="s-home" class="screen stack">
    <div class="top"><h1>Dreamscape</h1><button class="link" id="signout">Sign out</button></div>
    <div class="card sky" id="sky"><p class="muted small">Reading tonight's sky…</p></div>
    <div class="card" id="reading" style="display:none"></div>
    <button class="btn wake" id="woke">I just woke up</button>
    <button class="btn ghost" id="open-chart">My natal chart</button>
    <div id="resume"></div>
    <div class="card">
      <p class="muted small" style="margin-bottom:6px">Recent dreams</p>
      <div id="entries"><p class="muted small">Loading…</p></div>
    </div>
  </section>

  <!-- GUIDE -->
  <section id="s-guide" class="screen stack">
    <div class="progress" id="progress"></div>
    <div id="step"></div>
  </section>

  <!-- DREAM DETAIL -->
  <section id="s-detail" class="screen stack">
    <button class="link" id="detail-back" style="text-decoration:none">&larr; All dreams</button>
    <div id="detail"></div>
  </section>

  <!-- NATAL CHART -->
  <section id="s-chart" class="screen stack">
    <button class="link" id="chart-back" style="text-decoration:none">&larr; Home</button>
    <div id="chart"></div>
  </section>

  <!-- DONE -->
  <section id="s-done" class="screen stack">
    <h2>Held and recorded.</h2>
    <p class="muted">The sky at the moment you woke will be mapped against your chart within the next few hours.</p>
    <button class="btn ghost" id="home-again">Back to home</button>
  </section>

</main>

<div class="sheet-bg" id="sheet-bg"></div>
<div class="sheet" id="sheet"><p class="sec" id="sheet-kind"></p><h2 id="sheet-title"></h2><p id="sheet-body" style="margin-top:10px"></p>
  <button class="btn ghost" id="sheet-close" style="margin-top:18px">Close</button></div>

<div class="nav" id="nav" style="display:none">
  <div class="row">
    <button class="btn ghost" id="back">Back</button>
    <button class="btn" id="next">Next</button>
  </div>
</div>

<script>
const SUPABASE_URL = "https://gdefznymigdepxbvifnc.supabase.co";
const SUPABASE_KEY = "sb_publishable_Uh0RMZLNsTIyo-NPM8Vsjg_Vsr4sK4l";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const DRAFT_KEY = "dreamscape_draft_v1";

const SENSORY_Q = "What did the air smell or feel like? What colors dominated the space?";
const BODY = ["crown","third eye","throat","heart","solar plexus","gut","sacral","hands","feet","whole body","nowhere"];
const SENSATIONS = ["heavy chest","vibrations","cold","warmth","third eye pressure","tingling","sleep paralysis","racing heart","tears","stillness"];
const EMOTIONS = ["dread","euphoria","serenity","confusion","nostalgia","longing","fear","awe","grief","joy","anxiety","peace"];
const THRESHOLDS = [
  ["mundane","Mundane","Processing daily life"],
  ["astral_psychological","Astral / Psychological","A mirror of the psyche"],
  ["spiritual_lucid","Spiritual / Lucid","A transmission or visitation"],
];
const METRICS = [
  ["lucid_clarity","Lucid clarity","How aware were you that you were dreaming?"],
  ["vividness","Vividness","How sharp and real did it feel?"],
  ["emotional_intensity","Emotional intensity","How strongly did it move you?"],
  ["spiritual_resonance","Spiritual resonance","How meaningful does it feel?"],
  ["recall_completeness","Recall completeness","How much of it do you remember?"],
];
const SIGN_LABEL = s => s ? s[0].toUpperCase() + s.slice(1) : "";
const PRETTY = s => (s || "").replaceAll("_", " ");

let user = null, profile = null, draft = null, stepIdx = 0;
const $ = id => document.getElementById(id);

// ---------- storage (fails soft) ----------
function saveDraft() { try { localStorage.setItem(DRAFT_KEY, JSON.stringify(draft)); } catch (e) {} }
function loadDraft() { try { return JSON.parse(localStorage.getItem(DRAFT_KEY)); } catch (e) { return null; } }
function clearDraft() { try { localStorage.removeItem(DRAFT_KEY); } catch (e) {} }

function show(id) {
  document.querySelectorAll(".screen").forEach(s => s.classList.toggle("on", s.id === id));
  $("nav").style.display = id === "s-guide" ? "block" : "none";
  window.scrollTo(0, 0);
}

// ---------- auth ----------
$("signin").onclick = async () => {
  $("auth-err").textContent = "";
  const { error } = await sb.auth.signInWithPassword({ email: $("email").value.trim(), password: $("pw").value });
  if (error) $("auth-err").textContent = error.message; else boot();
};
$("signout").onclick = async () => { await sb.auth.signOut(); show("s-auth"); };

async function boot() {
  const { data } = await sb.auth.getSession();
  user = data.session?.user || null;
  if (!user) return show("s-auth");
  const { data: p } = await sb.from("profiles").select("current_tz, display_name").eq("user_id", user.id).maybeSingle();
  profile = p || { current_tz: "America/Detroit" };
  goHome();
}

function localDate(tz, d = new Date()) {
  return new Intl.DateTimeFormat("en-CA", { timeZone: tz, year: "numeric", month: "2-digit", day: "2-digit" }).format(d);
}

// ---------- home ----------
async function goHome() {
  show("s-home");
  const saved = loadDraft();
  $("resume").innerHTML = saved && saved.raw_text
    ? `<button class="btn ghost" id="resume-btn">Finish the dream you started</button>` : "";
  if (saved && saved.raw_text) $("resume-btn").onclick = () => { draft = saved; stepIdx = saved._step || 0; openGuide(); };
  renderSky();
  renderReading();
  renderEntries();
}

function moonSvg(illum, waxing) {
  const r = 20, k = 1 - 2 * (illum / 100);           // terminator x-scale
  const sweep = waxing ? 1 : 0;
  const lit = `M23 3 A20 20 0 0 ${sweep} 23 43 A${Math.abs(k * r)} 20 0 0 ${k > 0 ? 1 - sweep : sweep} 23 3`;
  return `<svg class="moon" viewBox="0 0 46 46"><circle cx="23" cy="23" r="20" fill="#2a2655"/>
          <path d="${lit}" fill="#e9e3ff"/></svg>`;
}

async function renderSky() {
  const today = localDate(profile.current_tz);
  const [{ data: ctx }, { data: eph }] = await Promise.all([
    sb.from("user_daily_context").select("day_ruler, night_ruler, moon_sign_at_sunrise, moon_natal_house").eq("local_date", today).maybeSingle(),
    sb.from("ephemeris_daily").select("moon_phase, moon_illumination, moon_sign, sun_moon_elongation").eq("day", today).maybeSingle(),
  ]);
  if (!eph) { $("sky").innerHTML = `<p class="muted small">Tonight's sky hasn't been calculated yet.</p>`; return; }
  const waxing = Number(eph.sun_moon_elongation) < 180;
  $("sky").innerHTML = `${moonSvg(Number(eph.moon_illumination), waxing)}
    <div><b>${term(PRETTY(eph.moon_phase), eph.moon_phase)} in ${term(SIGN_LABEL(eph.moon_sign), eph.moon_sign)}</b>
    <p class="muted small">${Math.round(eph.moon_illumination)}% lit${ctx?.moon_natal_house ? ` · ${houseTerm(ctx.moon_natal_house)}` : ""}</p>
    ${ctx ? `<p class="muted small">${term("Day", "day_ruler")} of ${term(SIGN_LABEL(ctx.day_ruler), ctx.day_ruler)} · night of ${term(SIGN_LABEL(ctx.night_ruler), ctx.night_ruler)}</p>` : ""}</div>`;
}
function ordinal(n) { return n + (["th","st","nd","rd"][(n % 100 - 20) % 10] || ["th","st","nd","rd"][n % 100] || "th"); }

async function renderEntries() {
  const { data, error } = await sb.from("dream_logs")
    .select("log_id, wake_time, raw_text, threshold_type, dream_sky(moon_phase, moon_sign, planetary_hour_ruler)")
    .order("wake_time", { ascending: false }).limit(10);
  if (error) { $("entries").innerHTML = `<p class="err">${error.message}</p>`; return; }
  if (!data.length) { $("entries").innerHTML = `<p class="muted small">No dreams logged yet. Your first one starts with the button above.</p>`; return; }
  $("entries").innerHTML = data.map(d => {
    const when = new Date(d.wake_time).toLocaleString([], { month: "short", day: "numeric", hour: "numeric", minute: "2-digit", timeZone: profile.current_tz });
    const sky = d.dream_sky ? `${PRETTY(d.dream_sky.moon_phase)} in ${SIGN_LABEL(d.dream_sky.moon_sign)} · hour of ${SIGN_LABEL(d.dream_sky.planetary_hour_ruler)}` : "sky pending";
    return `<div class="entry" data-id="${d.log_id}"><div class="meta"><span>${when}</span><span>${sky}</span>${d.threshold_type ? `<span>${PRETTY(d.threshold_type)}</span>` : ""}</div>
            <p>${escapeHtml(d.raw_text || "")}</p></div>`;
  }).join("");
  document.querySelectorAll(".entry").forEach(e => e.onclick = () => openDetail(e.dataset.id));
}
function escapeHtml(s) { return s.replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" })[c]); }

// ---------- guide ----------
$("woke").onclick = () => {
  draft = { wake_time: new Date().toISOString(), sleep_time: "", raw_text: "", sensory_details: "",
            somatic_resonance: [], somatic_anchors: [], threshold_type: null, primary_emotions: [],
            lucid_clarity: 5, vividness: 5, emotional_intensity: 5, spiritual_resonance: 5, recall_completeness: 5,
            voice_used: { raw: false, sensory: false }, _step: 0 };
  stepIdx = 0; saveDraft(); openGuide();
};
$("home-again").onclick = goHome;

const STEPS = [
  // 1. Low-friction entry
  { valid: () => draft.raw_text.trim().length > 0, render: () => `
      <p class="q">Everything you remember.</p>
      <p class="hint">Speak or type it exactly as it comes. Don't tidy it up.</p>
      <button class="mic" id="mic"><span class="dot"></span><span id="mic-label">Tap to speak</span></button>
      <textarea id="t" placeholder="I was standing in…">${escapeHtml(draft.raw_text)}</textarea>
      <div><label class="f" for="sleep">Fell asleep around (optional)</label><input id="sleep" type="time" value="${draft.sleep_time}"></div>`,
    bind: () => { bindText("t", "raw_text", "raw"); $("sleep").oninput = e => { draft.sleep_time = e.target.value; saveDraft(); }; } },
  // 2. Narrative / sensory
  { valid: () => true, render: () => `
      <p class="q">${SENSORY_Q}</p>
      <p class="hint">Skip if nothing comes.</p>
      <button class="mic" id="mic"><span class="dot"></span><span id="mic-label">Tap to speak</span></button>
      <textarea id="t" style="min-height:140px">${escapeHtml(draft.sensory_details)}</textarea>`,
    bind: () => bindText("t", "sensory_details", "sensory") },
  // 3. Somatic
  { valid: () => true, render: () => `
      <p class="q">Where in your body do you still hold the resonance of this dream?</p>
      ${chips("somatic_resonance", BODY)}
      <p class="hint" style="margin-top:22px">Anything you felt as you woke?</p>
      ${chips("somatic_anchors", SENSATIONS)}`,
    bind: () => bindChips() },
  // 4. Threshold
  { valid: () => !!draft.threshold_type, render: () => `
      <p class="q">Did this dream feel like…</p>
      <div class="stack">${THRESHOLDS.map(([v, t, d]) =>
        `<button class="opt ${draft.threshold_type === v ? "on" : ""}" data-v="${v}"><b>${t}</b><span>${d}</span></button>`).join("")}</div>`,
    bind: () => document.querySelectorAll(".opt").forEach(b => b.onclick = () => {
      draft.threshold_type = b.dataset.v; saveDraft(); renderStep(); }) },
  // 5. Metrics + emotion
  { valid: () => true, last: true, render: () => `
      <p class="q">Last, a quick reading.</p>
      ${METRICS.map(([k, t, h]) => `<div class="slider"><span>${t}</span><output id="o-${k}">${draft[k]}</output>
        <small>${h}</small><input type="range" min="1" max="10" value="${draft[k]}" data-k="${k}"></div>`).join("")}
      <p class="hint" style="margin-top:22px">The feeling it left you with</p>
      ${chips("primary_emotions", [...new Set([...EMOTIONS, ...draft.primary_emotions])])}
      <input type="text" id="own" placeholder="Add your own word, then tap Enter" style="margin-top:10px">`,
    bind: () => {
      document.querySelectorAll("input[type=range]").forEach(r => r.oninput = () => {
        draft[r.dataset.k] = Number(r.value); $("o-" + r.dataset.k).textContent = r.value; saveDraft(); });
      bindChips();
      $("own").onkeydown = e => { if (e.key === "Enter" && e.target.value.trim()) {
        const w = e.target.value.trim().toLowerCase();
        if (!draft.primary_emotions.includes(w)) draft.primary_emotions.push(w);
        saveDraft(); renderStep(); } };
    } },
];

function openGuide() { show("s-guide"); renderStep(); }

function renderStep() {
  stopMic();
  draft._step = stepIdx; saveDraft();
  const s = STEPS[stepIdx];
  $("progress").innerHTML = STEPS.map((_, i) => `<i class="${i <= stepIdx ? "on" : ""}"></i>`).join("");
  $("step").innerHTML = `<div class="stack">${s.render()}</div><p class="err" id="save-err" style="margin-top:12px"></p>`;
  s.bind();
  $("back").textContent = stepIdx === 0 ? "Cancel" : "Back";
  $("next").textContent = s.last ? "Save dream" : "Next";
  refreshNext();
}
function refreshNext() { $("next").disabled = !STEPS[stepIdx].valid(); }

$("back").onclick = () => {
  if (stepIdx === 0) { stopMic(); goHome(); return; }   // draft stays saved for later
  stepIdx--; renderStep();
};
$("next").onclick = async () => {
  if (!STEPS[stepIdx].valid()) return;
  if (!STEPS[stepIdx].last) { stepIdx++; renderStep(); return; }
  $("next").disabled = true; $("next").textContent = "Saving…";
  const { error } = await sb.from("dream_logs").insert(buildRow());
  if (error) { $("save-err").textContent = "Couldn't save: " + error.message + " Your entry is still kept on this phone."; refreshNext(); $("next").textContent = "Try again"; return; }
  clearDraft(); draft = null; show("s-done");
};

function buildRow() {
  const wake = new Date(draft.wake_time);
  let sleep_start = null;
  if (draft.sleep_time) {
    const [h, m] = draft.sleep_time.split(":").map(Number);
    const s = new Date(wake); s.setHours(h, m, 0, 0);
    if (s >= wake) s.setDate(s.getDate() - 1);         // fell asleep the previous evening
    sleep_start = s.toISOString();
  }
  const v = draft.voice_used;
  return {
    user_id: user.id,
    wake_time: draft.wake_time,
    sleep_start,
    raw_text: draft.raw_text.trim(),
    voice_transcript: v.raw ? draft.raw_text.trim() : null,
    transcript_status: v.raw ? "done" : "none",
    sensory_followup_q: SENSORY_Q,
    sensory_details: draft.sensory_details.trim() || null,
    somatic_resonance: draft.somatic_resonance,
    somatic_anchors: draft.somatic_anchors,
    threshold_type: draft.threshold_type,
    lucid_clarity: draft.lucid_clarity, vividness: draft.vividness,
    emotional_intensity: draft.emotional_intensity, spiritual_resonance: draft.spiritual_resonance,
    recall_completeness: draft.recall_completeness,
    primary_emotions: draft.primary_emotions,
    guide_session: { version: "guide-v1", input: { raw: v.raw ? "voice" : "typed", sensory: v.sensory ? "voice" : "typed" },
                     steps: [{ q: "Everything you remember", a: draft.raw_text.trim() },
                             { q: SENSORY_Q, a: draft.sensory_details.trim() },
                             { q: "Body resonance", a: draft.somatic_resonance },
                             { q: "Threshold", a: draft.threshold_type }] },
  };
}

function chips(field, list) {
  return `<div class="chips">${list.map(x => {
    const v = x.replaceAll(" ", "_");
    return `<button class="chip ${draft[field].includes(v) ? "on" : ""}" data-f="${field}" data-v="${v}">${x}</button>`;
  }).join("")}</div>`;
}
function bindChips() {
  document.querySelectorAll(".chip").forEach(c => c.onclick = () => {
    const arr = draft[c.dataset.f], v = c.dataset.v, i = arr.indexOf(v);
    i >= 0 ? arr.splice(i, 1) : arr.push(v);
    c.classList.toggle("on"); saveDraft();
  });
}
function bindText(id, field, voiceKey) {
  const t = $(id);
  t.oninput = () => { draft[field] = t.value; saveDraft(); refreshNext(); };
  $("mic").onclick = () => toggleMic(t, field, voiceKey);
}

// ---------- voice (on-device speech to text) ----------
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null, recWanted = false;
function toggleMic(t, field, voiceKey) {
  if (!SR) { $("mic-label").textContent = "Voice isn't supported in this browser"; return; }
  if (recWanted) return stopMic();
  recWanted = true;
  draft.voice_used[voiceKey] = true;
  rec = new SR(); rec.lang = "en-US"; rec.continuous = true; rec.interimResults = true;
  let base = t.value;
  rec.onresult = e => {
    let fin = "", interim = "";
    for (let i = e.resultIndex; i < e.results.length; i++) {
      (e.results[i].isFinal ? (fin += e.results[i][0].transcript) : (interim += e.results[i][0].transcript));
    }
    if (fin) base = (base ? base.trimEnd() + " " : "") + fin.trim();
    t.value = base + (interim ? " " + interim : "");
    draft[field] = base; saveDraft(); refreshNext();
  };
  rec.onend = () => { if (recWanted) { try { rec.start(); } catch (e) {} } };   // phones stop on pauses
  rec.onerror = e => { if (e.error === "not-allowed") { recWanted = false; $("mic-label").textContent = "Microphone permission denied"; } };
  rec.start();
  $("mic").classList.add("live"); $("mic-label").textContent = "Listening… tap to stop";
}
function stopMic() {
  recWanted = false;
  if (rec) { try { rec.stop(); } catch (e) {} rec = null; }
  const m = $("mic"); if (m) { m.classList.remove("live"); $("mic-label").textContent = "Tap to speak"; }
}

          <p class="small">${escapeHtml(m.figure || "")}</p><p class="muted small">${escapeHtml(m.reading || "")}</p></div>`).join("")}
      </div>

        <div class="bars">${["fire","water","air","earth"].map(k => `<span>${SIGN_LABEL(k)}</span>

        ${a.elemental_synergy_index != null ? `<p class="muted small">${term("Synergy with the sky", "synergy")}: ${Math.round(a.elemental_synergy_index * 100)}%</p>` : ""}
        ${em.reading ? `<p class="small">${escapeHtml(em.reading)}</p>` : ""}

      <p class="muted small">${[d.threshold_type && PRETTY(d.threshold_type), ...(d.primary_emotions || [])].filter(Boolean).map(PRETTY).join(" · ")}</p>

// ---------- daily reading ----------
async function renderReading() {
  const today = localDate(profile.current_tz);
  const { data } = await sb.from("astro_readings").select("content, local_date")
    .eq("kind", "daily").lte("local_date", today).order("local_date", { ascending: false }).limit(1).maybeSingle();
  const box = $("reading");
  if (!data) { box.style.display = "none"; return; }
  const c = data.content, stale = data.local_date !== today;
  box.style.display = "block";
  box.innerHTML = `<p class="sec">${stale ? "Latest sky reading" : "Today's sky"}</p>
    <h2 style="font-size:1.45rem">${escapeHtml(c.headline || "")}</h2>
    <p class="small" style="margin-top:8px">${escapeHtml(c.summary || "")}</p>
    <div id="reading-more" style="display:none" class="stack">
      ${c.moon ? `<p class="small" style="margin-top:12px"><b>Moon:</b> ${escapeHtml(c.moon)}</p>` : ""}
      ${(c.transits || []).map(t => `<div class="trig"><b>${escapeHtml(t.name)}</b><p class="muted small">${escapeHtml(t.body)}</p></div>`).join("")}
      ${c.rulers ? `<p class="muted small">${escapeHtml(c.rulers)} ${term("What's this?", "day_ruler")}</p>` : ""}
      ${c.for_tonight ? `<p class="small"><b>Tonight:</b> ${escapeHtml(c.for_tonight)}</p>` : ""}
    </div>
    <button class="more" id="reading-toggle">Read more</button>`;
  $("reading-toggle").onclick = () => {
    const m = $("reading-more"), open = m.style.display === "none";
    m.style.display = open ? "block" : "none"; $("reading-toggle").textContent = open ? "Show less" : "Read more";
  };
}

async function openChart() {
  show("s-chart");

  const [{ data: r }, { data: pts }] = await Promise.all([
    sb.from("astro_readings").select("content").eq("kind", "natal").maybeSingle(),
    sb.from("natal_points").select("point, sign, degree_in_sign, house, is_retrograde"),
  ]);
  const order = ["sun","moon","asc","mercury","venus","mars","jupiter","saturn","uranus","neptune","pluto","chiron","true_node","mc"];
  const rows = (pts || []).filter(p => order.includes(p.point)).sort((a, b) => order.indexOf(a.point) - order.indexOf(b.point));
  const c = r?.content;
  let html = `<div class="stack"><h1>${c ? escapeHtml(c.title) : "Your natal chart"}</h1>
    ${c ? `<p class="muted">${escapeHtml(c.intro)}</p>` : ""}

        <span class="muted small" style="text-align:right">${Math.floor(p.degree_in_sign)}° ${term(SIGN_LABEL(p.sign), p.sign)}${p.house ? " · " + term(ORD(p.house), "h" + p.house) : ""}${p.is_retrograde ? " · " + term("Rx", "retrograde") : ""}</span></div>`).join("")}

  }

}
